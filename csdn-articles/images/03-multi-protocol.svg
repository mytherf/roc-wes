<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg3)"/>
  <text x="480" y="38" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="20" font-weight="bold">7 种协议 · 统一 IDataService 接口 · 多协议数据接入</text>
  <!-- Center browser -->
  <rect x="370" y="200" rx="16" width="220" height="140" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" fill="#60a5fa" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Browser</text>
  <text x="480" y="262" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">useDataService()</text>
  <text x="480" y="282" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">IDataService</text>
  <text x="480" y="302" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">subscribe / unsubscribe</text>
  <text x="480" y="320" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">DataPoint { id, value, ts }</text>
  <!-- 7 protocol nodes around -->
  <!-- WebSocket: top-left -->
  <rect x="50" y="70" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="92" text-anchor="middle" fill="#93c5fd" font-family="Arial,sans-serif" font-size="12" font-weight="bold">WebSocket</text>
  <text x="115" y="108" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:8080 全双工</text>
  <line x1="180" y1="100" x2="370" y2="220" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <!-- HTTP -->
  <rect x="220" y="70" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="285" y="92" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="12" font-weight="bold">HTTP Polling</text>
  <text x="285" y="108" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:8081 定时拉取</text>
  <line x1="330" y1="120" x2="400" y2="200" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
  <!-- SSE -->
  <rect x="390" y="70" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="455" y="92" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="12" font-weight="bold">SSE</text>
  <text x="455" y="108" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:8082 单向推送</text>
  <line x1="455" y1="120" x2="465" y2="200" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
  <!-- MQTT -->
  <rect x="560" y="70" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5"/>
  <text x="625" y="92" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="12" font-weight="bold">MQTT</text>
  <text x="625" y="108" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:8083 发布/订阅</text>
  <line x1="590" y1="120" x2="540" y2="200" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <!-- S7 -->
  <rect x="730" y="70" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="795" y="92" text-anchor="middle" fill="#fcd34d" font-family="Arial,sans-serif" font-size="12" font-weight="bold">S7comm</text>
  <text x="795" y="108" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:19101 WS 网关</text>
  <line x1="760" y1="120" x2="580" y2="220" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  <!-- Bottom row: OPC UA, Modbus -->
  <!-- OPC UA -->
  <rect x="200" y="420" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#fb923c" stroke-width="1.5"/>
  <text x="265" y="442" text-anchor="middle" fill="#fdba74" font-family="Arial,sans-serif" font-size="12" font-weight="bold">OPC UA</text>
  <text x="265" y="458" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:19102 WS 网关</text>
  <line x1="300" y1="420" x2="420" y2="340" stroke="#fb923c" stroke-width="1" opacity="0.6"/>
  <!-- Modbus -->
  <rect x="560" y="420" rx="10" width="130" height="50" fill="#1e3a5f" stroke="#f472b6" stroke-width="1.5"/>
  <text x="625" y="442" text-anchor="middle" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Modbus TCP</text>
  <text x="625" y="458" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">:19100 WS 网关</text>
  <line x1="590" y1="420" x2="530" y2="340" stroke="#f472b6" stroke-width="1" opacity="0.6"/>
  <!-- Gateway box -->
  <rect x="350" y="380" rx="10" width="260" height="40" fill="#0d3b36" stroke="#14b8a6" stroke-width="1"/>
  <text x="480" y="405" text-anchor="middle" fill="#2dd4bf" font-family="Arial,sans-serif" font-size="11">Node.js WebSocket Gateway Bridge</text>
  <line x1="480" y1="340" x2="480" y2="380" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Device icons bottom -->
  <text x="165" y="500" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="10">🏭 PLC</text>
  <text x="480" y="500" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="10">⚙️ OPC Server</text>
  <text x="795" y="500" text-anchor="middle" fill="#475569" font-family="Arial,sans-serif" font-size="10">📟 Modbus Slave</text>
  <!-- Legend -->
  <g font-family="Arial,sans-serif" font-size="10">
    <rect x="50" y="480" rx="4" width="12" height="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="70" y="491" fill="#94a3b8">浏览器原生协议 (直连)</text>
    <rect x="220" y="480" rx="4" width="12" height="12" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1"/>
    <text x="240" y="491" fill="#94a3b8">工业 TCP 协议 (需 WS 网关桥接)</text>
  </g>
</svg>