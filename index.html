<!-- ========== 应用 HTML 入口 ==========
     这是整个 Web 应用唯一的一个 HTML 页面（SPA 单页应用）：
     - Vite 会以这个文件为起点，编译 src/main.ts 里的代码
     - 应用运行后所有界面都会动态渲染到 <div id="app"> 里 -->
<!doctype html>
<html lang="en">
  <head>
    <!-- 声明 UTF-8 字符编码，避免中文乱码 -->
    <meta charset="UTF-8" />
    <!-- 浏览器标签页上的小图标 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 移动端适配视口设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器标签页标题 -->
    <title>roc-wes</title>
    <!-- 启动加载画面专用样式：纯 HTML/CSS（不依赖 Vue），与窗口 backgroundColor
         同色，窗口一显示即无缝呈现；Vue 挂载后 #app 内容被整体替换，加载画面自动消失 -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e8e8e8;
      }
      #app .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #e8e8e8;
        color: #1f1f1f;
        font-family: 'Segoe UI', -apple-system, sans-serif;
      }
      #app .app-loading .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(115, 115, 115, 0.25);
        border-top-color: #1565c0;
        border-radius: 50%;
        animation: app-loading-spin 0.9s linear infinite;
      }
      #app .app-loading .text {
        font-size: 14px;
        letter-spacing: 2px;
        color: #5f5f5f;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Vue 应用挂载点：main.ts 里的 createApp 会把整个应用渲染进这个 div。
         挂载前的占位内容（启动加载画面）会被 Vue 挂载时整体替换 -->
    <div id="app">
      <div class="app-loading">
        <div class="spinner"></div>
        <div class="text">RocWes 正在启动…</div>
      </div>
    </div>
    <!-- 入口脚本：type="module" 表示支持 ES 模块 import/export 语法 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
