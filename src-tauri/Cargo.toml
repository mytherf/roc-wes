[workspace]
members = ["crates/*"]
resolver = "2"

[package]
name = "roc-wes-desktop"
version = "0.1.0"
description = "RocWes 仓储 SCADA 组态平台桌面端（Tauri 2 + Rust 原生设备网关）"
authors = ["roc"]
edition = "2021"

[lib]
name = "roc_wes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"

gateway-core = { path = "crates/gateway-core" }
gateway-engine = { path = "crates/gateway-engine" }
gateway-modbus = { path = "crates/gateway-modbus" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
