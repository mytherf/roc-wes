# ═══════════════════════════════════════════════════════════════
# gateway-websocket - WebSocket 适配器 crate
#
# 职责：真实模式 WebSocket 数据源由 Rust 原生客户端接管：
#   连接外部推送服务，订阅帧上行（{action,topic}）、数据帧解析入
#   最新值缓冲，read() 每轮差量同步订阅并排空缓冲上报。
# 由桌面壳组合根（factory.rs）按配置实例化并交给网关引擎。
# ═══════════════════════════════════════════════════════════════

[package]
name = "gateway-websocket"
version = "0.1.0"
description = "WebSocket 适配器（tokio-tungstenite）：订阅帧差量同步 + 最新值缓冲"
edition = "2021"

[dependencies]
gateway-core = { path = "../gateway-core" }            # 领域模型（配置/遥测/端口）
gateway-common = { path = "../gateway-common" }        # 帧解析与最新值缓冲
tokio = { version = "1", features = ["sync", "rt"] }   # mpsc 指令通道 + 后台任务
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }  # WebSocket 客户端（支持 wss）
futures-util = "0.3"   # Stream/Sink 扩展（WS 拆分）
async-trait = "0.1"    # async trait（DeviceAdapter 实现）
serde_json = "1"       # 订阅帧/数据帧 JSON
tracing = "0.1"        # 日志

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }  # 集成测试运行时
