# ═══════════════════════════════════════════════════════════════
# gateway-web - Web 协议适配器 crate（WebSocket / HTTP / SSE / MQTT）
#
# 职责：真实模式的四种 Web 协议数据源由 Rust 原生客户端接管，
#   与演示模式/工业协议同一条链路（gateway-engine 会话轮询 + IPC 事件），
#   WebView 不再直接发起任何协议连接。
# 推送型协议（ws/sse/mqtt）采用「后台读取任务 + 最新值缓冲」模式，
# read() 每轮询周期同步订阅差量并排空缓冲上报。
# ═══════════════════════════════════════════════════════════════

[package]
name = "gateway-web"
version = "0.1.0"
description = "Web 协议适配器（WebSocket/HTTP/SSE/MQTT）：Rust 原生客户端接管真实模式数据源"
edition = "2021"

[dependencies]
gateway-core = { path = "../gateway-core" }  # 领域模型（配置/遥测/端口）
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }  # 任务/通道/定时
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }  # WebSocket 客户端（支持 wss）
futures-util = "0.3"   # Stream/Sink 扩展（WS 拆分、SSE 字节流）
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }  # HTTP 轮询 + SSE 流（支持 https）
percent-encoding = "2" # 点ID 拼入查询参数时的 URL 编码
rumqttc = { version = "0.25", default-features = false, features = ["url", "websocket", "use-rustls"] }  # MQTT 客户端（url 解析支持 ws:// 与 mqtt://）
async-trait = "0.1"    # async trait（DeviceAdapter 实现）
serde_json = "1"       # 推送帧 JSON 解析
tracing = "0.1"        # 日志

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }  # 集成测试运行时
