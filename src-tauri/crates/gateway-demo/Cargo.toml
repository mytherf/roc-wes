# ═══════════════════════════════════════════════════════════════
# gateway-demo - 演示适配器 crate
#
# 职责：实现 DeviceAdapter 端口，不连真实设备，
# 按点位 ID 生成平滑模拟曲线（基线 + 正弦波 + 抖动），
# 作为桌面端“演示模式”的唯一数据源。
# ═══════════════════════════════════════════════════════════════

[package]
name = "gateway-demo"
version = "0.1.0"
description = "演示适配器：桌面端演示模式的模拟数据源（替代浏览器版 mock 网关）"
edition = "2021"

[dependencies]
gateway-core = { path = "../gateway-core" }  # 领域模型（配置/遥测/端口）
async-trait = "0.1"   # async trait（DeviceAdapter 实现）
serde_json = "1"       # JSON 值类型（模拟数值）
