<!doctype html>
<!-- ========== Rust 侧启动画面（splash 窗口） ==========
     纯静态 HTML/CSS，零 JavaScript、不依赖 Vue/Vite 模块加载，
     应用进程一启动即可瞬间渲染。由 tauri.conf.json 中的 splashscreen
     窗口加载；主界面就绪后由 Rust 侧（lib.rs 轮询检测 window.__rocwesReady）
     关闭本窗口并显示主窗口。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e293b;
        color: #e2e8f0;
        font-family: 'Segoe UI', -apple-system, sans-serif;
        user-select: none;
        cursor: default;
      }
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #f1f5f9;
      }
      .logo .accent {
        color: #3b82f6;
      }
      .sub {
        font-size: 12px;
        letter-spacing: 4px;
        color: #64748b;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      .text {
        font-size: 13px;
        letter-spacing: 2px;
        color: #94a4b8;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">Roc<span class="accent">Wes</span></div>
      <div class="sub">仓储控制组态平台</div>
      <div class="spinner"></div>
      <div class="text">正在启动…</div>
    </div>
  </body>
</html>
